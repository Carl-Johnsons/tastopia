---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Install docker v28.1.1
  ansible.builtin.include_tasks: ./docker.yml

- name: Install dotnet v8.0
  ansible.builtin.include_tasks: ./dotnet.yml

- name: Install infisical
  ansible.builtin.include_tasks: ./infisical.yml

- name: Install nodejs v22
  ansible.builtin.include_tasks: ./node.yml

- name: Install java v17
  ansible.builtin.include_tasks: ./java.yml

- name: Install python v3.13
  ansible.builtin.include_tasks: ./python.yml
