apiVersion: apps/v1
kind: Deployment
metadata:
  name: signalr
spec:
  selector:
    matchLabels:
      app: signalr
  template:
    metadata:
      labels:
        app: signalr
    spec:
      restartPolicy: Always
      volumes:
        - name: tls-certs
          secret:
            secretName: signalr-tls
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
      containers:
      - name: signalr
        image: taiduc113/tastopia:signalr
        volumeMounts:
          - name: tls-certs
            mountPath: /etc/ssl/certs/server-cert.crt
            subPath: tls.crt
          - name: tls-certs
            mountPath: /etc/ssl/private/private-key.pem
            subPath: tls.key
        envFrom:
          - secretRef:
              name: global-secret
          - secretRef:
              name: signalr-secret
        resources:
          requests:
            cpu: "250m"
            memory: "64Mi"
          limits:
            memory: "500M"
            cpu: "500m"
        ports:
        - containerPort: 80
          protocol: TCP
        - containerPort: 443
          protocol: TCP
