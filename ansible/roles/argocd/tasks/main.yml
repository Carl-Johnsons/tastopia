---
- name: Check argocd
  ansible.builtin.command: which argocd
  register: argocd_check_unix
  changed_when: false
  failed_when: false
  when: ansible_os_family != "Windows"

- name: Check argocd
  ansible.windows.win_shell: |
    Get-Command argocd
  register: argocd_check_windows
  changed_when: false
  failed_when: false
  when: ansible_os_family == "Windows"

- name: Load OS-specific tasks
  ansible.builtin.include_tasks: "{{ ansible_os_family | lower }}.yml"
  when:
    - >
      (ansible_os_family == "Windows" and argocd_check_windows.rc != 0)
      or
      (ansible_os_family != "Windows" and argocd_check_unix.rc != 0)
