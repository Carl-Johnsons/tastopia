x-build-labels: &build-labels
  org.opencontainers.image.source: https://github.com/Carl-Johnsons/tastopia

services:
  redis:
    image: redis:alpine
    container_name: redis
    volumes:
      # - ./redis.conf:/usr/local/etc/redis/redis-full.conf
      - ./data/redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: always
    networks:
      - back-end
    environment:
      - REDIS_PASSWORD=$REDIS_PASSWORD
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]

  postgres:
    image: postgres:17.0-alpine
    container_name: postgres
    volumes:
      - ./data/db:/var/lib/postgresql/data
    ports:
      # PostgreSQL uses the default port 5432
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: always
    networks:
      - back-end
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  mongo:
    image: mongo
    ports:
      # MongoDB uses the default port 27017
      - "${MONGODB_PORT}:27017"
    restart: always
    container_name: mongo
    volumes:
      - ./data/mongodb:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    networks:
      - back-end
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "-u",
          "${MONGO_INITDB_ROOT_USERNAME}",
          "-p",
          "${MONGO_INITDB_ROOT_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--quiet",
          "--eval",
          "db.runCommand('ping').ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  rabbitmq:
    # login guest:guest
    image: rabbitmq:4.0.2-management
    hostname: "rabbitmq"
    container_name: service-bus
    restart: always
    labels:
      NAME: "rabbitmq"
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    networks:
      - back-end
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST}
      RABBITMQ_MANAGEMENT_ALLOW_WEB_ACCESS: true
    volumes:
      - "./data/mq:/var/lib/rabbitmq"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 5

  consul:
    image: hashicorp/consul
    container_name: consul
    ports:
      # Consul uses the default port 8500
      - "${CONSUL_PORT}:8500"
    networks:
      - front-end
      - back-end
    extra_hosts:
      - "host.docker.internal:host-gateway" # For using host.docker.internal in linux
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8500/v1/status/leader || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  contract:
    build:
      context: .
      dockerfile: ./dockerfiles/contract/Dockerfile.prod
      labels: *build-labels
      cache_from:
        - ghcr.io/carl-johnsons/tastopia-contract:buildcache
      cache_to:
        - ghcr.io/carl-johnsons/tastopia-contract:buildcache

  api-gateway:
    build:
      context: .
      dockerfile: ./dockerfiles/api-gateway/Dockerfile.${DOCKERFILE_API_GATEWAY_ENV:-prod}
      labels: *build-labels
      cache_from:
        - ghcr.io/carl-johnsons/tastopia-api-gateway:buildcache
      cache_to:
        - ghcr.io/carl-johnsons/tastopia-api-gateway:buildcache
    container_name: apigateway
    networks:
      - back-end
    env_file:
      - .env.${ENV:-production}
      - ./app/server/APIGateway/.env.${ENV:-production}
    depends_on:
      identity-api: 
        condition: service_started
      redis:
        condition: service_healthy
    develop:
      watch:
        - path: ./app/server/APIGateway/src
          action: sync
          target: /src
          ignore:
            - Contract/

  identity-api:
    build:
      context: .
      dockerfile: ./dockerfiles/identity-api/Dockerfile.${DOCKERFILE_IDENTITY_ENV:-prod}
      labels: *build-labels
      cache_from:
        - ghcr.io/carl-johnsons/tastopia-identity-api:buildcache
      cache_to:
        - ghcr.io/carl-johnsons/tastopia-identity-api:buildcache
    container_name: identity-service
    volumes:
      - ./data/nuget:/src/nuget
    depends_on:
      signalr:
        condition: service_healthy
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - back-end
    env_file:
      - .env.${ENV:-production}
      - ./app/server/IdentityService/.env.${ENV:-production}
    develop:
      watch:
        - path: ./app/server/IdentityService/src
          action: sync
          target: /src
          ignore:
            - Contract/

  recipe-api:
    build:
      context: .
      dockerfile: ./dockerfiles/recipe-api/Dockerfile.${DOCKERFILE_RECIPE_ENV:-prod}
      labels: *build-labels
      cache_from:
        - ghcr.io/carl-johnsons/tastopia-recipe-api:buildcache
      cache_to:
        - ghcr.io/carl-johnsons/tastopia-recipe-api:buildcache
    container_name: recipe-service
    volumes:
      - ./data/nuget:/src/nuget
    depends_on:
      signalr:
        condition: service_healthy
      mongo:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - back-end
    env_file:
      - .env.${ENV:-production}
      - ./app/server/RecipeService/.env.${ENV:-production}
    develop:
      watch:
        - path: ./app/server/RecipeService/src
          action: sync
          target: /src
          ignore:
            - Contract/

  user-api:
    build:
      context: .
      dockerfile: ./dockerfiles/user-api/Dockerfile.${DOCKERFILE_USER_ENV:-prod}
      labels: *build-labels
      cache_from:
        - ghcr.io/carl-johnsons/tastopia-user-api:buildcache
      cache_to:
        - ghcr.io/carl-johnsons/tastopia-user-api:buildcache
    container_name: user-service
    volumes:
      - ./data/nuget:/src/nuget
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - back-end
    env_file:
      - .env.${ENV:-production}
      - ./app/server/UserService/.env.${ENV:-production}
    develop:
      watch:
        - path: ./app/server/UserService/src
          action: sync
          target: /src
          ignore:
            - Contract/

  notification-api:
    build:
      context: .
      dockerfile: ./dockerfiles/notification-api/Dockerfile.${DOCKERFILE_NOTIFICATION_ENV:-prod}
      labels: *build-labels
      cache_from:
        - ghcr.io/carl-johnsons/tastopia-notification-api:buildcache
      cache_to:
        - ghcr.io/carl-johnsons/tastopia-notification-api:buildcache
    container_name: notification-service
    volumes:
      - ./data/nuget:/src/nuget
    depends_on:
      signalr:
        condition: service_healthy
      mongo:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - back-end
    env_file:
      - .env.${ENV:-production}
      - ./app/server/NotificationService/.env.${ENV:-production}
    develop:
      watch:
        - path: ./app/server/NotificationService/src
          action: sync
          target: /src
          ignore:
            - Contract/

  upload-api:
    build:
      context: .
      dockerfile: ./dockerfiles/upload-api/Dockerfile.${DOCKERFILE_UPLOAD_ENV:-prod}
      labels: *build-labels
      cache_from:
        - ghcr.io/carl-johnsons/tastopia-upload-api:buildcache
      cache_to:
        - ghcr.io/carl-johnsons/tastopia-upload-api:buildcache
    container_name: upload-service
    volumes:
      - ./data/nuget:/src/nuget
    depends_on:
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - back-end
    env_file:
      - .env.${ENV:-production}
      - ./app/server/UploadFileService/.env.${ENV:-production}
    develop:
      watch:
        - path: ./app/server/UploadFileService/src
          action: sync
          target: /src
          ignore:
            - Contract/

  tracking-api:
    build:
      context: .
      dockerfile: ./dockerfiles/tracking-api/Dockerfile.${DOCKERFILE_UPLOAD_ENV:-prod}
      labels: *build-labels
      cache_from:
        - ghcr.io/carl-johnsons/tastopia-tracking-api:buildcache
      cache_to:
        - ghcr.io/carl-johnsons/tastopia-tracking-api:buildcache
    container_name: tracking-service
    volumes:
      - ./data/nuget:/src/nuget
    depends_on:
      mongo:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - back-end
    env_file:
      - .env.${ENV:-production}
      - ./app/server/TrackingService/.env.${ENV:-production}
    develop:
      watch:
        - path: ./app/server/TrackingService/src
          action: sync
          target: /src
          ignore:
            - Contract/

  # Python service 
  ingredient-predict-api:
    build:
      context: .
      dockerfile: ./dockerfiles/ingredient-predict-api/Dockerfile.prod
      labels: *build-labels
      cache_from:
        - ghcr.io/carl-johnsons/tastopia-ingredient-predict-api:buildcache
      cache_to:
        - ghcr.io/carl-johnsons/tastopia-ingredient-predict-api:buildcache
      args:
        PYTHON_ENV: ${ENV:-production}
    container_name: ingredient-predict-service
    volumes:
      - ./app/server/IngredientPredictService/model:/app/model
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - back-end
    env_file:
      - .env.${ENV:-production}
      - ./app/server/IngredientPredictService/.env.${ENV:-production}

  # Real-time communication 
  signalr:
    build:
      context: .
      dockerfile: ./dockerfiles/signalr/Dockerfile.prod
      labels: *build-labels
      cache_from:
        - ghcr.io/carl-johnsons/tastopia-signalr:buildcache
      cache_to:
        - ghcr.io/carl-johnsons/tastopia-signalr:buildcache
    container_name: signalr-service
    volumes:
      - ./data/nuget:/src/nuget
    depends_on:
      consul:
        condition: service_healthy
    networks:
      - back-end
    env_file:
      - .env.${ENV:-production}
      - ./app/server/SignalRService/.env.${ENV:-production}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Website dashboard
  website:
    build:
      context: .
      dockerfile: ./dockerfiles/website/Dockerfile.prod
      labels: *build-labels
      cache_from:
        - ghcr.io/carl-johnsons/tastopia-website:buildcache
      cache_to:
        - ghcr.io/carl-johnsons/tastopia-website:buildcache
      args:
        BUILD_ENV: ${ENV:-production}
    container_name: website-dashboard
    networks:
      - front-end
    env_file:
      - ./app/client/website/.env.${ENV:-production}

  # Worker services
  email-worker:
    build:
      context: .
      dockerfile: ./dockerfiles/email-worker/Dockerfile.prod
      labels: *build-labels
      cache_from:
        - ghcr.io/carl-johnsons/tastopia-email-worker:buildcache
      cache_to:
        - ghcr.io/carl-johnsons/tastopia-email-worker:buildcache
    container_name: email-worker
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - back-end
    env_file:
      - .env.${ENV:-production}
      - ./app/server/NotificationService/.env.${ENV:-production}

  sms-worker:
    build:
      context: .
      dockerfile: ./dockerfiles/sms-worker/Dockerfile.prod
      labels: *build-labels
      cache_from:
        - ghcr.io/carl-johnsons/tastopia-sms-worker:buildcache
      cache_to:
        - ghcr.io/carl-johnsons/tastopia-sms-worker:buildcache
    container_name: sms-worker
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - back-end
    env_file:
      - .env.${ENV:-production}
      - ./app/server/NotificationService/.env.${ENV:-production}

  push-notification-worker:
    build:
      context: .
      dockerfile: ./dockerfiles/push-notification-worker/Dockerfile.prod
      labels: *build-labels
      cache_from:
        - ghcr.io/carl-johnsons/tastopia-push-notification-worker:buildcache
      cache_to:
        - ghcr.io/carl-johnsons/tastopia-push-notification-worker:buildcache
    container_name: push-notification-worker
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - back-end
    env_file:
      - .env.${ENV:-production}
      - ./app/server/NotificationService/.env.${ENV:-production}

  recipe-worker:
    build:
      context: .
      dockerfile: ./dockerfiles/recipe-worker/Dockerfile.prod
      labels: *build-labels
      cache_from:
        - ghcr.io/carl-johnsons/tastopia-recipe-worker:buildcache
      cache_to:
        - ghcr.io/carl-johnsons/tastopia-recipe-worker:buildcache
    container_name: recipe-worker
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - back-end
    env_file:
      - .env.${ENV:-production}
      - ./app/server/RecipeService/.env.${ENV:-production}

networks:
  back-end:
  front-end:
