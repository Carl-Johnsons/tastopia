apiVersion: apps/v1
kind: Deployment
metadata:
  name: recipe-worker
spec:
  selector:
    matchLabels:
      app: recipe-worker
  template:
    metadata:
      labels:
        app: recipe-worker
    spec:
      restartPolicy: Always
      containers:
      - name: recipe-worker
        image: taiduc113/tastopia:recipe-worker
        imagePullPolicy: Always
        envFrom:
          - secretRef:
              name: global-secret
        resources:
          requests:
            cpu: "250m"
            memory: "64Mi"
          limits:
            memory: "500M"
            cpu: "500m"
        ports:
        - containerPort: 80
          protocol: TCP
