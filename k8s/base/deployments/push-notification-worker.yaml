apiVersion: apps/v1
kind: Deployment
metadata:
  name: push-notification-worker
spec:
  selector:
    matchLabels:
      app: push-notification-worker
  template:
    metadata:
      labels:
        app: push-notification-worker
    spec:
      restartPolicy: Always
      containers:
      - name: push-notification-worker
        image: taiduc113/tastopia:push-notification-worker
        imagePullPolicy: Always
        envFrom:
          - secretRef:
              name: global-secret
        resources:
          requests:
            cpu: "20m"
            memory: "64Mi"
          limits:
            memory: "500M"
            cpu: "500m"
        ports:
        - containerPort: 80
          protocol: TCP
