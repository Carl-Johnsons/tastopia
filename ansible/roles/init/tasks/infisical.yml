---
- name: Read INFISICAL_TOKEN from .env.local (if exists)
  ansible.builtin.shell: |
    set -a
    [ -f "{{ env_file_path }}" ] && . "{{ env_file_path }}" && echo "${INFISICAL_TOKEN:-}"
    set +a
  register: env_result
  changed_when: false
  failed_when: false

- name: Set infisical_token fact
  ansible.builtin.set_fact:
    infisical_token: "{{ env_result.stdout | trim }}"

- name: Infisical token not found
  ansible.builtin.pause:
    prompt: "Enter your Infisical token: "
    echo: false
  register: prompt_token
  when: infisical_token | length == 0

- name: Set final token
  ansible.builtin.set_fact:
    infisical_token: "{{ prompt_token.user_input | default(infisical_token) }}"

- name: Create .env.local file with Infisical Token
  become: false
  ansible.builtin.copy:
    dest: "{{ env_file_path }}"
    content: |
      INFISICAL_TOKEN='{{ infisical_token }}'
    mode: "0600"
