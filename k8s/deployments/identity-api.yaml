apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-api
spec:
  selector:
    matchLabels:
      app: identity-api
  template:
    metadata:
      labels:
        app: identity-api
    spec:
      restartPolicy: Always
      initContainers:
        - name: db-wait
          image: postgres:17.0-alpine
          envFrom: 
            - secretRef:
                name: global-secret
          command: 
            - sh
            - -c
            - |
              until PGPASSWORD=$POSTGRES_PASSWORD psql -h $DB_HOST -U $POSTGRES_USER -d postgres -c '\q'; do
                echo 'Waiting for database to be creatable...'
                sleep 2
              done

              echo 'Database is online'
              echo 'Waiting for 10s before doing migration...'
              sleep 10
              echo 'Migration started'

        - name: db-migrate
          envFrom: 
            - secretRef:
                name: global-secret
            - secretRef:
                name: identity-api-secret
          image: taiduc113/tastopia:identity-api
          command: ["dotnet","DuendeIdentityServer.dll", "--migrate", "--seed"]
      containers:
      - name: identity-api
        image: taiduc113/tastopia:identity-api
        imagePullPolicy: Always
        envFrom:
          - secretRef:
              name: global-secret
          - secretRef:
              name: identity-api-secret
        resources:
          requests:
            cpu: "250m"
            memory: "64Mi"
          limits:
            memory: "500M"
            cpu: "500m"
        ports:
        - containerPort: 80
          protocol: TCP
        - containerPort: 443
          protocol: TCP
