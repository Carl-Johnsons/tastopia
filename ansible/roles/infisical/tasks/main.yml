---
- name: Check infisical on Linux/macOS
  ansible.builtin.command: which infisical
  register: infisical_check_unix
  changed_when: false
  failed_when: false
  when: ansible_os_family != "Windows"

- name: Check infisical on Windows
  ansible.windows.win_shell: |
    Get-Command infisical
  register: infisical_check_windows
  changed_when: false
  failed_when: false
  when: ansible_os_family == "Windows"

- name: Load OS-specific tasks
  ansible.builtin.include_tasks: "{{ ansible_os_family | lower }}.yml"
  when:
    - >
      (ansible_os_family == "Windows" and infisical_check_windows.rc != 0)
      or
      (ansible_os_family != "Windows" and infisical_check_unix.rc != 0)
