apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rabbitmq
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: "/tastopia/ci/deploy/rabbitmq"
            pathType: Prefix
            backend:
              service:
                name: rabbitmq
                port:
                  number: 15672
