name: CI Pipeline

on:
  pull_request:
    branches: 
      - staging
  push:
    branches: 
      - master
      - staging
  workflow_dispatch:
    inputs:
      BUILD_SERVICES:
        description: "space-separated services"
        required: false
      DEPLOY_ENV:
        description: "'staging' or 'production'"
        required: true
        default: "staging"

env:
  ENV: >-
    ${{ github.event.inputs.DEPLOY_ENV
      || (github.ref_name == 'master' && 'production'
      || github.ref_name == 'staging'
         && (github.event_name == 'push' && 'staging' || 'dev')
      || 'dev')
    }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Detect services
        id: detect
        run: |
          BUILD_SERVICES="${{ github.event.inputs.BUILD_SERVICES }}"

          if [ "$BUILD_SERVICES" != "" ]; then
            echo "Manual override: $BUILD_SERVICES"
            echo "services=$BUILD_SERVICES" >> $GITHUB_OUTPUT
            exit 0
          fi

          ./scripts/ci/build/detect-service-changed.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build_app:
    name: Build mobile application
    runs-on: ubuntu-latest
    needs: detect
    if: ${{ contains(needs.detect.outputs.services, 'mobile') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The mobile building and testing flow have the same ansible dependencies
      - name: Install dependencies
        run: |
            if ! pipx list | rg -q 'package ansible-core'; then
              pipx install --include-deps ansible-core
            fi

            pipx runpip ansible-core install requests
            cd ansible
            ./run-build-fe.sh

      - name: Setup ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache

      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: app/client/mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false 
      
      - name: Retrieve secrets
        run: |
          echo "INFISICAL_TOKEN=${INFISICAL_TOKEN}" > .env.local
          ./scripts/env/pull-env.sh
          echo "$GOOGLE_SERVICES_CREDENTIALS" | base64 -d > app/client/mobile/google-services.json
        env:
          GOOGLE_SERVICES_CREDENTIALS: ${{ secrets.GOOGLE_SERVICES_CREDENTIALS }}
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}

      - name: Build Android application
        run: ./scripts/ci/build/build-app.sh
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          IDENTITY_FQDN: ${{ secrets.IDENTITY_FQDN }}
          API_GATEWAY_FQDN: ${{ secrets.API_GATEWAY_FQDN }}
    outputs:
      sha: ${{ steps.build_serv.outputs.sha }}
    env:
      INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
      GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
      GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install dependencies
        id: install_deps
        run: |
          echo "Begin install deps"
          ./scripts/ci/install-deps.sh
          echo "End install deps"

      - name: Retrieve secrets
        id: ret_sec
        run: |
          echo "INFISICAL_TOKEN=${INFISICAL_TOKEN}" > .env.local
          ./scripts/env/pull-env.sh

          mkdir -p data/Auth.Store
          echo "${GMAIL_TOKEN}" > data/Auth.Store/Google.Apis.Auth.OAuth2.Responses.TokenResponse-user

          mkdir -p app/server/NotificationService/src/EmailWorker
          echo "${GMAIL_CREDENTIALS}" > app/server/NotificationService/src/EmailWorker/credentials.json

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        # This does not expand env variable ${DOCKER_USERNAME} so i have to inject from object secrets
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}
      
      - name: Build services
        id: build_serv
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          ./scripts/docker/build-services.sh -c $SHORT_SHA -le ${{ github.event.inputs.DEPLOY_ENV || 'staging' }} ${{ needs.detect.outputs.services }}
  setup-dev-env:
    name: Setup dev environment manifests in gitOps repository
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
    - name: Checkout GitOps repo
      uses: actions/checkout@v6
      with:
        repository: ${{ secrets.GITOPS_REPO_NAME }}
        token: ${{ secrets.GITOPS_REPO_TOKEN }}
        ref: improve-ci
    - name: Check if Infisical secret file exists
      id: check_secret
      run: |
        SECRET_FILE="k8s/bootstrap/infisical-operator/base/secrets/infisical-secrets-pr-${PR_NUMBER}.yaml"

        if [ -f "$SECRET_FILE" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi
    - name: Setup Infisical for dev environment
      if: steps.check_secret.outputs.exists == 'false'
      run: |
        cd k8s/bootstrap/infisical-operator/base

        export SECRET_FILE="secrets/infisical-secrets-pr-${PR_NUMBER}.yaml"
        export APP_NAMESPACE="tastopia-pr-$PR_NUMBER"
        export MONITORING_NAMESPACE="monitoring-pr-$PR_NUMBER"
        export SUFFIX="pr-${PR_NUMBER}"

        yq '.spec.authentication.serviceToken.secretsScope.envSlug = "staging"' secrets/infisical-secrets.yaml \
          | yq '(.spec.managedKubeSecretReferences[] | select(.secretNamespace == "tastopia") | .secretNamespace) = strenv(APP_NAMESPACE)' \
          | yq '(.spec.managedKubeSecretReferences[] | select(.secretNamespace == "monitoring") | .secretNamespace) = strenv(MONITORING_NAMESPACE)' \
          | yq '.metadata.name = .metadata.name + "-" + strenv(SUFFIX)' \
          > "$SECRET_FILE"

        yq -i 'with(.resources; select(all_c(. != strenv(SECRET_FILE))) | . += strenv(SECRET_FILE))' ./kustomization.yaml
    - name: Ensure that value file exists
      run: |
        VALUES_FILE="k8s/helm/values-pr-${PR_NUMBER}.yaml"

        if [ ! -f "$VALUES_FILE" ]; then
          echo "Values file does not exist, creating..."
          cp "k8s/helm/values-staging.yaml" "$VALUES_FILE"
        fi
    - name: Commit & push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit \
          -m "Set up PR #${PR_NUMBER}" \
          -m "PR #${PR_NUMBER}: ${PR_TITLE} (${PR_URL})" \
          || echo "No changes"
        git push
  update-manifest:
    name: Update service manifest in gitOps repository
    runs-on: ubuntu-latest
    needs: [detect, build, setup-dev-env]
    if: always() && needs.build.result == 'success'
    steps:
    - name: Checkout GitOps repo
      uses: actions/checkout@v6
      with:
        repository: ${{ secrets.GITOPS_REPO_NAME }}
        token: ${{ secrets.GITOPS_REPO_TOKEN }}
        ref: improve-ci
    - name: Update image tag
      run: |
        #!/bin/bash
        
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          VALUES_FILE="k8s/helm/values-pr-${PR_NUMBER}.yaml"
        else
          case "$BRANCH" in
            master) 
              VALUES_FILE="k8s/helm/values-production.yaml"
              ;;
            staging) 
              VALUES_FILE="k8s/helm/values-staging.yaml"
              ;;
            *) 
              echo Unsupported branch
              exit 1
              ;;
          esac
        fi

        if [ ! -f "$VALUES_FILE" ]; then
          echo "Values file does not exist, please add it before running the workflow..."
          exit 1
        fi

        for SERVICE in ${{ needs.detect.outputs.services }}; do
          echo "Updating $SERVICE..."
          IMAGE="taiduc113/tastopia-${SERVICE}:${{ needs.build.outputs.sha }}"
          sed -i "s|taiduc113/tastopia-${SERVICE}:.*|${IMAGE}|g" "$VALUES_FILE"
        done
      env:
        BRANCH: ${{ github.head_ref || github.ref_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_URL: ${{ github.event.pull_request.html_url }}
    - name: Commit & push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git add .
        git commit -m "Update image to ${{ needs.build.outputs.sha }}" || echo "No changes"
        git push
