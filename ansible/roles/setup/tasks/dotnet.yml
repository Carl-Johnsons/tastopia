---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
  changed_when: false

- name: Install prerequisites for Microsoft package repo
  ansible.builtin.package:
    name:
      - wget
      - apt-transport-https
      - software-properties-common
    state: present

- name: Download Microsoft package repo
  ansible.builtin.get_url:
    url: https://packages.microsoft.com/config/ubuntu/20.04/packages-microsoft-prod.deb
    dest: /tmp/packages-microsoft-prod.deb
    mode: '0644'

- name: Register Microsoft package repo
  ansible.builtin.command: dpkg -i /tmp/packages-microsoft-prod.deb
  register: ms_repo
  changed_when: ms_repo.rc == 0

- name: Remove Microsoft repo installer
  ansible.builtin.file:
    path: /tmp/packages-microsoft-prod.deb
    state: absent

- name: Update apt cache after adding Microsoft repo
  ansible.builtin.apt:
    update_cache: true
  changed_when: false

- name: Install .NET SDK 8.0
  ansible.builtin.package:
    name: dotnet-sdk-8.0
    state: present

- name: Get installed .NET runtimes
  ansible.builtin.command: dotnet --list-runtimes
  register: dotnet_out
  changed_when: false

- name: Print installed .NET runtimes
  ansible.builtin.debug:
    var: dotnet_out.stdout_lines
