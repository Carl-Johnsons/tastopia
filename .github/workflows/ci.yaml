name: CI Pipeline

on:
  pull_request:
    branches:
      - staging
    paths:
      - "app/**"
      - "scripts/**"
      - "dockerfiles/**"
      - "ansible/**"
      - "docker-compose.yml"
      - ".github/workflows/ci.yaml"
  push:
    branches:
      - master
      - staging
    paths:
      - "app/**"
      - "scripts/**"
      - "dockerfiles/**"
      - "ansible/**"
      - "docker-compose.yml"
      - ".github/workflows/ci.yaml"
  workflow_dispatch:
    inputs:
      DEPLOY_ENV:
        description: "'staging' or 'production'"
        required: true
        default: "staging"

concurrency:
  group: >-
    ci-${{ github.event_name == 'pull_request'
      && format('pr-{0}', github.event.pull_request.number)
      || github.ref_name
    }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  ENV: >-
    ${{ github.event.inputs.DEPLOY_ENV
      || (github.ref_name == 'master' && 'production'
      || github.ref_name == 'staging'
         && (github.event_name == 'push' && 'staging' || 'dev')
      || 'dev')
    }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  derive-state:
    name: Derive service state
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.derive.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize shell scripts for act
        if: ${{ env.ACT }}
        run: |
          find scripts -type f -name "*.sh" -exec sed -i 's/\r$//' {} \;

      - name: Install GitHub CLI for act
        if: ${{ env.ACT }}
        run: |
          apt update
          apt install -y gh

      - name: Derive services
        id: derive
        run: |
          SERVICES=$(python3 ./scripts/ci/build/derive-service-state.py)
          echo "services=$SERVICES" >> $GITHUB_OUTPUT
  build_app:
    name: Build mobile application
    runs-on: ubuntu-latest
    needs: derive-state
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize shell scripts for act
        if: ${{ env.ACT }}
        run: |
          find scripts -type f -name "*.sh" -exec sed -i 's/\r$//' {} \;
          find ansible -type f -name "*.sh" -exec sed -i 's/\r$//' {} \;
      # The mobile building and testing flow have the same ansible dependencies
      - name: Install dependencies
        run: |
            if ! pipx list | rg -q 'package ansible-core'; then
              pipx install --include-deps ansible-core
            fi

            pipx runpip ansible-core install requests
            cd ansible
            bash ./run-build-fe.sh

      - name: Setup ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache

      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: app/client/mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false 
      
      - name: Retrieve secrets
        run: |
          echo "INFISICAL_TOKEN=${INFISICAL_TOKEN}" > .env.local
          bash ./scripts/env/pull-env.sh
          echo "$GOOGLE_SERVICES_CREDENTIALS" | base64 -d > app/client/mobile/google-services.json
        env:
          GOOGLE_SERVICES_CREDENTIALS: ${{ secrets.GOOGLE_SERVICES_CREDENTIALS }}
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}

      - name: Build Android application
        run: |
          MOBILE_TAG=$(echo "${{ needs.derive-state.outputs.services }}" | grep -o 'mobile:[^ ]*' | cut -d: -f2)
          bash ./scripts/ci/build/build-app.sh -t "$MOBILE_TAG"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          HOST_PREFIX: ${{ vars.HOST_PREFIX }}
          IDENTITY_FQDN: ${{ vars.IDENTITY_FQDN }}
          API_GATEWAY_FQDN: ${{ vars.API_GATEWAY_FQDN }}
          API_GATEWAY_PORT: ${{ vars.API_GATEWAY_PORT }}
  mobile_test:
    name: Mobile E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [derive-state, build_app, build_backend]
    if: >-
      always() && 
      needs.derive-state.result == 'success' &&
      (needs.build_app.result == 'success' || needs.build_app.result == 'skipped') && 
      (needs.build_backend.result == 'success' || needs.build_backend.result == 'skipped') &&
      !(needs.build_app.result == 'skipped' && needs.build_backend.result == 'skipped')
    env:
      MAESTRO_VERSION: "1.1.14"
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Normalize shell scripts for act
        if: ${{ env.ACT }}
        run: |
          find scripts -type f -name "*.sh" -exec sed -i 's/\r$//' {} \;
          find ansible -type f -name "*.sh" -exec sed -i 's/\r$//' {} \;

      - name: Maestro runner cache
        uses: actions/cache@v5
        with:
          path: ~/.maestro-runner
          key: maestro-runner-${{ runner.os }}-${{ env.MAESTRO_VERSION }}
      
      - name: Install dependencies
        run: |
            bash ./scripts/ci/test/install-testing-deps.sh
            if ! pipx list | rg -q 'package ansible-core'; then
              pipx install --include-deps ansible-core
            fi
            pipx runpip ansible-core install requests
            cd ansible
            bash ./run-test.sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Enable KVM group perms
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false 

      # - name: AVD cache
        # uses: actions/cache@v5
        # id: avd_cache
        # with:
          # path: |
            # ~/.android/avd/*
            # ~/.android/adb*
          # key: avd-27

      - name: Create AVD and generate snapshot for caching
        if: steps.avd_cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 27
          target: google_apis_playstore
          profile: medium_phone
          force-avd-creation: false
          emulator-options: -no-window -gpu software -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching"

      - name: Run tests
        id: run_tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 27
          target: google_apis_playstore
          profile: medium_phone
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu software -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            MOBILE_TAG=$(printf "%s\n" "${SERVICES}" | grep -o "mobile:[^ ]*" | cut -d: -f2 | head -n1 || true)
            bash ./scripts/ci/test/install-app.sh -t "$MOBILE_TAG"
            bash ./scripts/ci/test/test-e2e.sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          HOST_PREFIX: ${{ vars.HOST_PREFIX }}
          API_GATEWAY_FQDN: ${{ vars.API_GATEWAY_FQDN }}
          API_GATEWAY_PORT: ${{ vars.API_GATEWAY_PORT }}
          E2E_TEST_USERNAME: ${{ secrets.MOBILE_E2E_TEST_USERNAME }}
          E2E_TEST_PASSWORD: ${{ secrets.MOBILE_E2E_TEST_PASSWORD }}
          BUILT_IMAGES: ${{ needs.derive-state.outputs.services }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}

      - name: Deploy test reports
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app/client/mobile/reports
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          keep_files: true

      - name: E2E report summary
        id: mobile_summary
        if: always()
        run: |
          latest_report_dir=$(ls -1 app/client/mobile/reports/ 2>/dev/null | sort | tail -n 1)

          if [ "${{ steps.run_tests.outcome }}" = "success" ]; then
            STATUS="✅ Success"
          else
            STATUS="❌ Failed"
          fi

          REPORT_LINK="No report found"
          DIR="N/A"

          if [ -n "$latest_report_dir" ] && [ -d "app/client/mobile/reports/$latest_report_dir" ]; then
            REPORT_LINK="[View report](https://carl-johnsons.github.io/tastopia/$latest_report_dir/report.html)"
            DIR="\`$latest_report_dir\`"
            echo "report_dir=$latest_report_dir" >> "$GITHUB_OUTPUT"
          fi

          echo "status=${{ steps.run_tests.outcome }}" >> "$GITHUB_OUTPUT"

          {
            echo "### Mobile E2E Test Report"
            echo ""
            echo "| Status | Report | Directory |"
            echo "|--------|--------|-----------|"
            echo "| $STATUS | $REPORT_LINK | $DIR |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment test result on PR
        if: always() && github.event_name == 'pull_request'
        uses: ./.github/actions/comment-test-result
        with:
          platform: mobile
          status: ${{ steps.run_tests.outcome }}
          job_status: ${{ job.status }}
          report_dir: ${{ steps.mobile_summary.outputs.report_dir }}
  website_test:
    name: Website E2E tests
    runs-on: ubuntu-latest
    needs: [derive-state, build_backend]
    if: >-
      always() &&
      needs.derive-state.result == 'success' &&
      needs.build_backend.result == 'success'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: app/client/website/package-lock.json
        
      - name: Install dependencies
        working-directory: ansible
        run: ./run-test.sh

      - name: Install dependencies
        working-directory: app/client/website
        run: npm ci

      - name: Run tests
        id: run_website_tests
        run: bash ./scripts/ci/test/test-website-e2e.sh
        env:
          HOST_PREFIX: ${{ vars.HOST_PREFIX }}
          WEBSITE_FQDN: ${{ vars.WEBSITE_FQDN }}
          IDENTITY_FQDN: ${{ vars.IDENTITY_FQDN }}
          API_GATEWAY_FQDN: ${{ vars.API_GATEWAY_FQDN }}
          API_GATEWAY_PORT: ${{ vars.API_GATEWAY_PORT }}
          E2E_TEST_USERNAME: ${{ secrets.WEBSITE_E2E_TEST_USERNAME }}
          E2E_TEST_PASSWORD: ${{ secrets.WEBSITE_E2E_TEST_PASSWORD }}
          BUILT_IMAGES: ${{ needs.derive-state.outputs.services }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}

      - name: Prepare website report
        if: always()
        id: prepare_website_report
        run: |
          html_source_dir="app/client/website/cypress/reports/html"
          logs_source_dir="app/client/website/cypress/reports/logs"
          report_dir="website-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          target_dir="app/client/website/reports/$report_dir"

          if [ ! -d "$html_source_dir" ] && [ ! -d "$logs_source_dir" ]; then
            exit 0
          fi

          mkdir -p "$target_dir"

          if [ -d "$html_source_dir" ]; then
            cp -R "$html_source_dir"/. "$target_dir"/
          fi

          if [ -d "$logs_source_dir" ]; then
            mkdir -p "$target_dir/logs"
            cp -R "$logs_source_dir"/. "$target_dir/logs"/
          fi

          echo "report_dir=$report_dir" >> "$GITHUB_OUTPUT"

      - name: Deploy test reports
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app/client/website/reports
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          keep_files: true

      - name: E2E report summary
        id: website_summary
        if: always()
        run: |
          if [ "${{ steps.run_website_tests.outcome }}" = "success" ]; then
            STATUS="✅ Success"
          else
            STATUS="❌ Failed"
          fi

          REPORT_LINK="No report found"
          DIR="N/A"
          WEBSITE_REPORT_DIR="${{ steps.prepare_website_report.outputs.report_dir }}"

          if [ -n "$WEBSITE_REPORT_DIR" ]; then
            REPORT_LINK="[View report](https://carl-johnsons.github.io/tastopia/$WEBSITE_REPORT_DIR/index.html)"
            DIR="\`$WEBSITE_REPORT_DIR\`"
          fi

          echo "status=${{ steps.run_website_tests.outcome }}" >> "$GITHUB_OUTPUT"

          {
            echo "### Website E2E Test Report"
            echo ""
            echo "| Status | Report | Directory |"
            echo "|--------|--------|-----------|"
            echo "| $STATUS | $REPORT_LINK | $DIR |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment test result on PR
        if: always() && github.event_name == 'pull_request'
        uses: ./.github/actions/comment-test-result
        with:
          platform: website
          status: ${{ steps.run_website_tests.outcome }}
          job_status: ${{ job.status }}
          report_dir: ${{ steps.prepare_website_report.outputs.report_dir }}

  build_backend:
    name: Build backend services
    runs-on: ubuntu-latest
    needs: derive-state
    outputs:
      sha: ${{ steps.build_serv.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize shell scripts for act
        if: ${{ env.ACT }}
        run: |
          find scripts -type f -name "*.sh" -exec sed -i 's/\r$//' {} \;
          find ansible -type f -name "*.sh" -exec sed -i 's/\r$//' {} \;

      - name: Install dependencies
        id: install_deps
        run: |
          echo "Begin install deps"
          bash ./scripts/ci/build/install-deps.sh
          echo "End install deps"

      - name: Retrieve secrets
        id: ret_sec
        run: |
          echo "INFISICAL_TOKEN=${INFISICAL_TOKEN}" > .env.local
          bash ./scripts/env/pull-env.sh

          mkdir -p data/Auth.Store
          echo "${GMAIL_TOKEN}" > data/Auth.Store/Google.Apis.Auth.OAuth2.Responses.TokenResponse-user

          mkdir -p app/server/NotificationService/src/EmailWorker
          echo "${GMAIL_CREDENTIALS}" > app/server/NotificationService/src/EmailWorker/credentials.json
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build services
        id: build_serv
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          bash ./scripts/docker/build-services.sh -t -le "$ENV" ${{ needs.derive-state.outputs.services }}
        env:
          HOST_PREFIX: ${{ vars.HOST_PREFIX }}
          API_GATEWAY_FQDN: ${{ vars.API_GATEWAY_FQDN }}
          API_GATEWAY_PORT: ${{ vars.API_GATEWAY_PORT }}
          WEBSITE_FQDN: ${{ vars.WEBSITE_FQDN }}
          IDENTITY_FQDN: ${{ vars.IDENTITY_FQDN }}
          DUENDE_IDS6_ID: ${{ secrets.DUENDE_IDS6_ID }}
