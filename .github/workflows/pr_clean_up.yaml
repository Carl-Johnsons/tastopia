name: PR Clean Up

on:
  pull_request:
    branches: 
      - staging
    types:
      - closed

jobs:
  update-manifest:
    name: Clean up manifest in gitOps repository
    runs-on: ubuntu-latest
    env:
      GITOPS_REPO_NAME: ${{ secrets.GITOPS_REPO_NAME }}
      GITOPS_REPO_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN }}
    steps:
    - name: Checkout GitOps repo
      uses: actions/checkout@v6
      with:
        repository: ${{ secrets.GITOPS_REPO_NAME }}
        token: ${{ secrets.GITOPS_REPO_TOKEN }}
        ref: improve-ci
    - name: Delete PR values file
      run: |
        #!/bin/bash
        
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          PR_NUMBER="${{ github.event.pull_request.number }}"
          VALUES_FILE="k8s/helm/values-pr-${PR_NUMBER}.yaml"
        fi

        if [ -f "$VALUES_FILE" ]; then
          echo "Values file exists, deleting..."
          rm "$VALUES_FILE"
        fi
      env:
        BRANCH: ${{ github.head_ref || github.ref_name }}
    - name: Commit & push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git add .
        git commit -m "Clean up PR #${PR_NUMBER}: ${PR_TITLE} (${PR_URL})" || echo "No changes"
        git push
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_URL: ${{ github.event.pull_request.html_url }}
