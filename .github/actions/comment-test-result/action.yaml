name: "Comment E2E Test Results"
description: "Updates PR comment with E2E test results for a specific platform"
inputs:
  platform:
    description: "The platform being tested ('mobile' or 'website')"
    required: true
  status:
    description: "The outcome of the test step ('success', 'failure', 'cancelled', 'skipped')"
    required: false
    default: ""
  job_status:
    description: "Overall job status ('success', 'failure', 'cancelled')"
    required: false
    default: ""
  report_dir:
    description: "The directory name where the report was published"
    required: false
    default: ""
  github_token:
    description: "GitHub Token with pull-requests: write, issues: write, and actions: read permissions"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Update PR comment with test status
      uses: actions/github-script@v7
      env:
        PLATFORM: ${{ inputs.platform }}
        TEST_STATUS: ${{ inputs.status }}
        JOB_STATUS: ${{ inputs.job_status }}
        REPORT_DIR: ${{ inputs.report_dir }}
      with:
        github-token: ${{ inputs.github_token || github.token }}
        script: |
          const run = require(`${process.env.GITHUB_ACTION_PATH}/comment.cjs`);
          await run({ github, context });
