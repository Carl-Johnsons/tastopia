apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-api
spec:
  selector:
    matchLabels:
      app: identity-api
  template:
    metadata:
      labels:
        app: identity-api
    spec:
      restartPolicy: Always
      initContainers:
      - name: db-init
        image: taiduc113/tastopia:identity-api
        command: ["sh", "-c"]
        args:
          - |
            until nc -z $DB_HOST $DB_PORT; do
              echo "Waiting for database..."
              sleep 2
            done
            dotnet DuendeIdentityServer.dll --migrate --seed
      containers:
      - name: identity-api
        image: taiduc113/tastopia:identity-api
        envFrom:
          - secretRef:
              name: global-secret
          - secretRef:
              name: identity-api-secret
        resources:
          requests:
            cpu: "250m"
            memory: "64Mi"
          limits:
            memory: "500M"
            cpu: "500m"
        ports:
        - containerPort: 80
          protocol: TCP
        - containerPort: 443
          protocol: TCP
