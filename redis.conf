# Network settings
# bind 127.0.0.1
# port 6379
# protected-mode yes

# General settings
# daemonize no
# pidfile /var/run/redis_6379.pid
# loglevel notice
# logfile "" # Empty string sends logs to standard output

# Persistence (RDB snapshots)
save 10 1    # Save if at least 1 key changed in 900 seconds (15 minutes)
# save 300 10   # Save if at least 10 keys changed in 300 seconds (5 minutes)
# save 60 10000 # Save if at least 10000 keys changed in 60 seconds (1 minute)
# dbfilename dump.rdb
# dir ./

# Memory management
# maxmemory <bytes> # Example: maxmemory 1gb (set a reasonable limit)
# maxmemory-policy noeviction # How Redis behaves when maxmemory is reached

# Security
requirepass <REDIS_PASSWORD> # Set a strong password for authentication

# Client limits
# maxclients 10000

# Append Only File (AOF) persistence
# appendonly no # Set to 'yes' for AOF persistence
# appendfsync everysec # How often AOF changes are written to disk
