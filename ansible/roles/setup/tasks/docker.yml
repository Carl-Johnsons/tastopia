---
- name: Add Docker’s official GPG key and repository, then install Docker
  block:
    - name: Ensure dependencies are installed
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true

    - name: Create keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker repository
      ansible.builtin.shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] \
        https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo \"${UBUNTU_CODENAME:-$VERSION_CODENAME}\") stable" \
        > /etc/apt/sources.list.d/docker.list
      args:
        executable: /bin/bash
      register: rc
      changed_when: rc is success

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Get Docker CE version string
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          apt-cache madison docker-ce | awk '{ print $3 }' | grep 28.1.1 | head -n 1
      register: docker_version
      changed_when: false

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - "docker-ce={{ docker_version.stdout }}"
          - "docker-ce-cli={{ docker_version.stdout }}"
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Enable and start Docker service
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started
